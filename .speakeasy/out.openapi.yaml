    patch:
      summary: Apply a patch to the transmitter.
      parameters:
        - name: transmitter_id
          in: path
          description: |
            The transmitter ID.
          required: false
          style: simple
          explode: false
          schema:
            format: base32hex
            example: trl9f1ropjojsj2gv8rrbc7k9ku918lpum9s4n7ophngl3sa
      requestBody:
        content:
          application/json:
            schema:
              required:
                - patch
              properties:
