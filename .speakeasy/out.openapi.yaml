                Strictly speaking, since the first 10 bits of the data are overwritten to ensure that the resulting string always starts with `at`, the actual entropy is 230 bits. The `at` here denotes Arena Transaction ID.
                The purpose of this process is to enable someone encountering a 48-character base32hex-encoded string beginning with `at` to infer that it might be an Arena Transaction ID. Conversely, a random string not starting with `at` can be identified as not being an Arena Transaction ID.
              style: simple
              explode: false
              schema:
                format: base32hex
                example: at26kkal1b9qounb2s5i4581vdrkub6sg6un88hej69ncigi
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      result:
                        properties:
                          status:
                            enum:
                              - success
                              - failure
                              - bad_request
                              - unauthorized
                              - forbidden
                              - not_found
                              - conflict
                              - server_error
                              - service_unavailable
                          code: {}
                          message: {}
                  - properties:
                      events:
                        items:
                          properties:
                            id:
                              description: |
                                This is the primary key of the record representing the event within the stream.
                            jti:
                              description: |
                                This is the value of the `jti` claim of the Security Event Token (SET) used to deliver this event.
                            subject_identifier:
                              description: |
                                This is the subject identifier of the event, in one of the formats described in RFC 9493 Subject Identifiers for Security Event Tokens.
                            event_identifier:
                              description: |
                                This is the event identifier (a URI) of the event.
                              format: uri
                            toe:
                              description: |
                                This is the date and time at which the event occurred. The format is `YYYY-MM-DDThh:mm:ss`.
                              format: date-time
                      next_cursor: {}
