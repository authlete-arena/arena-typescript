  /ssf/transmitter:
    post:
      summary: Create a transmitter.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - required:
                    - metadata
                  properties:
                    metadata:
                      required:
                        - issuer
                      properties:
                        spec_version:
                          maxLength: 255
                          description: |
                            OPTIONAL. A version identifying the implementer's draft or final specification implemented by the Transmitter. This includes the numerical portion of the spec version as described in the document [[NAMINGCONVENTION](https://openid.net/wg/resources/naming-and-contents-of-specifications/)].
                          example: "1_0"
                        issuer:
                          maxLength: 255
                          description: |
                            REQUIRED. URL using the `https` scheme with no query or fragment component that the Transmitter asserts as its Issuer Identifier. This MUST be identical to the `iss` claim value in Security Event Tokens issued from this Transmitter.
                          format: uri
                          example: https://transmitter.example.com
                        jwks_uri:
                          maxLength: 255
                          description: |
                            OPTIONAL. URL of the Transmitter's JSON Web Key Set [[RFC7517](https://www.rfc-editor.org/rfc/rfc7517.html)] document. This contains the signing key(s) the Receiver uses to validate signatures from the Transmitter. This value MUST be specified if the Transmitter intends to generate signed JWTs. If present, this URL MUST use HTTP over TLS [[RFC9110](https://www.rfc-editor.org/rfc/rfc9110.html)].
                          format: uri
                          example: https://transmitter.example.com/ssf/jwks
                        delivery_methods_supported:
                          uniqueItems: true
                          description: |
                            RECOMMENDED. List of supported delivery method URIs.
                          example:
                            - urn:ietf:rfc:8935
                            - urn:ietf:rfc:8936
                          items:
                            format: uri
                        configuration_endpoint:
                          maxLength: 255
                          description: |
                            OPTIONAL. The URL of the Configuration Endpoint. If present, this URL MUST use HTTP over TLS [[RFC9110](https://www.rfc-editor.org/rfc/rfc9110.html)].
                          format: uri
                          example: https://transmitter.example.com/ssf/configuration
                        status_endpoint:
                          maxLength: 255
                          description: |
                            OPTIONAL. The URL of the Status Endpoint. If present, this URL MUST use HTTP over TLS [[RFC9110](https://www.rfc-editor.org/rfc/rfc9110.html)].
                          format: uri
                          example: https://transmitter.example.com/ssf/status
                        add_subject_endpoint:
                          maxLength: 255
                          description: |
                            OPTIONAL. The URL of the Add Subject Endpoint. If present, this URL MUST use HTTP over TLS [[RFC9110](https://www.rfc-editor.org/rfc/rfc9110.html)].
                          format: uri
                          example: https://transmitter.example.com/ssf/add_subject
                        remove_subject_endpoint:
                          maxLength: 255
                          description: |
                            OPTIONAL. The URL of the Remove Subject Endpoint. If present, this URL MUST use HTTP over TLS [[RFC9110](https://www.rfc-editor.org/rfc/rfc9110.html)].
                          format: uri
                          example: https://transmitter.example.com/ssf/remove_subject
                        verification_endpoint:
                          maxLength: 255
                          description: |
                            OPTIONAL. The URL of the Verification Endpoint. If present, this URL MUST use HTTP over TLS [[RFC9110](https://www.rfc-editor.org/rfc/rfc9110.html)].
                          format: uri
                          example: https://transmitter.example.com/ssf/verification
                        critical_subject_members:
                          uniqueItems: true
                          description: |
                            OPTIONAL. An array of member names in a Complex Subject which, if present in a Subject Member in an event, MUST be interpreted by a Receiver.
                          example:
                            - tenant
                            - user
                          items: {}
                        authorization_schemes:
                          description: |
                            OPTIONAL. An array of JSON objects that specify the supported authorization scheme properties. To enable seamless discovery of configurations, the service provider SHOULD, with the appropriate security considerations, make the `authorization_schemes` attribute publicly accessible without prior authentication.
                          example:
                            - spec_urn: urn:ietf:rfc:6749
                            - spec_urn: urn:ietf:rfc:8705
                            - spec_urn: urn:ietf:rfc:9449
                          items:
                            required:
                              - spec_urn
                            properties:
                              spec_urn:
                                format: uri
                                example: urn:ietf:rfc:6749
                        default_subjects:
                          description: |
                            OPTIONAL. A string indicating the default behavior of newly created streams. If present, the value MUST be either `"ALL"` or `"NONE"`. If not provided, the Transmitter behavior in this regard is unspecified.
                            - `"ALL"` indicates that any subjects that are appropriate for the
                              stream are added to the stream by default. The Receiver MAY remove
                              subjects from the stream via the `remove_subject_endpoint`, causing
                              events for those subjects to _not_ be transmitted. The Receiver MAY
                              re-add any subjects removed this way via the `add_subject_endpoint`.

                            - `"NONE"` indicates that no subjects are added by default. The Receiver
                              MAY add subjects to the stream via the `add_subject_endpoint`,
                              causing only events for those subjects to be transmitted. The Receiver
                              MAY remove subjects added this way via the `remove_subject_endpoint`.
                          example: NONE
                          default: NONE
                          enum:
                            - ALL
                            - NONE
                      description: |
                        Transmitter Configuration Metadata defined in [OpenID Shared Signals Framework Specification 1.0](https://openid.net/specs/openid-sharedsignals-framework-1_0.html).
                    settings:
                      properties:
                        name:
                          maxLength: 255
                          description: The name of this Transmitter
                          example: Transmitter Name
                        description:
                          description: The description about this Transmitter
                          example: Transmitter Description
                        fapi2_compliant:
                          description: |
                            This boolean flag indicates whether FAPI 2.0 compliance is required.

                            If this flag is set to `true`, the requirements defined in the
                            [FAPI 2.0 Security Profile](https://openid.net/specs/fapi-security-profile-2_0-final.html)
                            are enforced. One notable requirement is that access tokens must
                            be sender-constrained using either MTLS
                            ([RFC 8705](https://www.rfc-editor.org/rfc/rfc8705.html)) or DPoP
                            ([RFC 9449](https://www.rfc-editor.org/rfc/rfc9449.html)).
                          default: false
                        dpop_required:
                          description: |
                            This boolean flag indicates whether access tokens must be
                            sender-constrained using the DPoP
                            ([RFC 9449](https://www.rfc-editor.org/rfc/rfc9449.html)) mechanism.
                          default: false
                        dpop_nonce_required:
                          description: |
                            This boolean flag indicates whether DPoP proof JWTs must include the
                            `nonce` claim.

                            If this flag is set to `true`, the DPoP proof JWT presented with a
                            DPoP-key-bound access token must include the `nonce` claim. Otherwise,
                            the server will return a `401 Unauthorized` response with the error
                            code `use_dpop_nonce` and a `DPoP-Nonce` header. If the client receives
                            this error, it must regenerate a DPoP proof JWT including the `nonce`
                            claim, using the nonce value specified in the `DPop-Nonce` header, and
                            retry the request.

                            Also note that the nonce value expires periodically. This means that
                            the client will periodically receive a `401 Unauthorized` response
                            with the error code `invalid_dpop_proof` and a `DPoP-Nonce` header.
                            If the client receives this error, it must regenerate a DPoP proof JWT
                            including the `nonce` claim with the updated nonce value specified in
                            the `DPoP-Nonce` header and retry the request.

                            See [RFC 9449](https://www.rfc-editor.org/rfc/rfc9449.html) for details
                            about the DPoP nonce.
                          default: false
                        max_clock_skew_seconds:
                          minimum: 0
                          description: |
                            The maximum clock skew in seconds. This value is taken into account
                            when validating time-related properties, such as the expiration time
                            of an access token.

                            Note that when FAPI 2.0 compliance is required (i.e., when the
                            `fapi2_compliant` flag is set to `true`), the maximum clock skew is
                            adjusted to ensure that it falls within the range of 10 to 60 seconds.
                          example: 30
                        authorization_servers:
                          description: |
                            The list of authorization servers this Transmitter queries for access token information.
                          example:
                            - http://host.docker.internal:13100
                            - https://as.example.com
                          items:
                            format: uri
                        introspection_configurations:
                          description: |
                            The list of configurations for access token introspection.
                          example:
                            - issuer: https://trial.authlete.net
                              scheme: Basic
                              user_id: rs0
                              password: rs0-secret
                          items:
                            description: |
                              Configuration for access token introspection ([RFC 7662](https://www.rfc-editor.org/rfc/rfc7662.html)).
                            allOf:
                              - properties:
                                  scheme:
                                    description: The HTTP authentication scheme.
                                    enum:
                                      - Basic
                                      - Bearer
                                      - DPoP
                                  user_id:
                                    description: "The user ID, required for the Basic Authentication."
                                  password:
                                    description: "The password, required for the Basic Authentication."
                                  access_token:
                                    description: "The access token, required for the Bearer or DPoP Authentication."
                                description: HTTP Authentication Configuration
                                allOf:
                                  - {}
                                  - {}
                              - required:
                                  - issuer
                                properties:
                                  issuer:
                                    description: The identifier of the authorization server.
                                    format: uri
                        events_supported:
                          uniqueItems: true
                          description: |
                            OPTIONAL. An array of URIs identifying the set of events supported by the Transmitter for a Receiver. If omitted, Event Transmitters SHOULD make this set available to the Event Receiver via some other means (e.g. publishing it in online documentation).
                          example:
                            - https://schemas.openid.net/secevent/caep/event-type/session-revoked
                            - https://schemas.openid.net/secevent/caep/event-type/token-claims-change
                            - https://schemas.openid.net/secevent/caep/event-type/credential-change
                            - https://schemas.openid.net/secevent/caep/event-type/assurance-level-change
                            - https://schemas.openid.net/secevent/caep/event-type/device-compliance-change
                            - https://schemas.openid.net/secevent/caep/event-type/session-established
                            - https://schemas.openid.net/secevent/caep/event-type/session-presented
                            - https://schemas.openid.net/secevent/caep/event-type/risk-level-change
                            - https://schemas.openid.net/secevent/risc/event-type/account-credential-change-required
                            - https://schemas.openid.net/secevent/risc/event-type/account-purged
                            - https://schemas.openid.net/secevent/risc/event-type/account-disabled
