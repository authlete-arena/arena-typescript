                The purpose of this process is to enable someone encountering a 48-character base32hex-encoded string beginning with `at` to infer that it might be an Arena Transaction ID. Conversely, a random string not starting with `at` can be identified as not being an Arena Transaction ID.
              style: simple
              explode: false
              schema:
                format: base32hex
                example: at26kkal1b9qounb2s5i4581vdrkub6sg6un88hej69ncigi
          content:
            application/jwk-set+json:
              schema:
                required:
                  - keys
                properties:
                  keys:
                    items:
                      required:
                        - kty
                      properties:
                        kty:
                          example: EC
                        use:
                          example: sig
                        key_ops:
                          example: sign
                        alg:
                          example: ES256
                        kid: {}
                        x5u:
                          format: uri
                        x5c:
                          items: {}
                        x5t:
                          format: base64url
                        x5t#S256:
                          format: base64url
                      description: |
                        JWK defined in [RFC 7517: JSON Web Key (JWK)](https://www.rfc-editor.org/rfc/rfc7517.html).
                description: |
                  JWK Set defined in [RFC 7517: JSON Web Key (JWK)](https://www.rfc-editor.org/rfc/rfc7517.html).
              example:
                keys:
                  - kty: EC
                    alg: ES256
                    kid: PIAIySIwpP0yVeqMEB1BuntqquucPCHHfBtj9okUeug
                    use: sig
                    crv: P-256
                    x: rW4UsgZ_gaxbaiTUzzWRSYBcn3SG8D1LnppazRDzp18
                    "y": gpKr0A44O_czk5lp3B6kxCwPxU6TxB9XkenI4NLMks8
      security: []
      x-speakeasy-group: metadata
      x-speakeasy-name-override: getJwks
    parameters:
      - name: x-fapi-interaction-id
        in: header
        description: |
          This header is defined in "[FAPI 1.0 Baseline](https://openid.net/specs/openid-financial-api-part-1-1_0.html)" and "FAPI 2.0 Implementation Advice". If the request includes this header, the response will contain a response header with the same name and the same value. If the request does not include this header, the value of the corresponding response header will be a randomly generated value. This mechanism is designed for tracking communication. When using this header, its value must be a UUID as defined in [RFC 4122](https://www.rfc-editor.org/rfc/rfc4122.html).
        required: false
        style: simple
        explode: false
        schema:
          format: uuid
          example: 1152537a-7f40-4405-860e-0fbdc75837b3
  /openapi:
    get:
      summary: Retrieve the OpenAPI document of this web application.
      description: |
        This API publishes the OpenAPI document of this web application in a manner conformant to the [MicroProfile OpenAPI Specification](https://microprofile.io/).
      externalDocs:
        description: MicroProfile OpenAPI Specification
        url: https://microprofile.io/
      parameters:
        - name: format
          in: query
          description: |
            The format of the OpenAPI document. Either `YAML` or `JSON` (case-insensitive). The default format is `YAML` as required by the [MicroProfile OpenAPI Specification](https://microprofile.io/).
          required: false
          style: form
          explode: true
          schema:
            enum:
              - YAML
              - JSON
      responses:
        "200":
          description: |
            A successful response including the OpenAPI document of this web application.
          headers:
            x-fapi-interaction-id:
              description: |
                This header is defined in "[FAPI 1.0 Baseline](https://openid.net/specs/openid-financial-api-part-1-1_0.html)" and "FAPI 2.0 Implementation Advice". If the request includes this header, the response will contain a response header with the same name and the same value. If the request does not include this header, the value of the corresponding response header will be a randomly generated value. This mechanism is designed for tracking communication. When using this header, its value must be a UUID as defined in [RFC 4122](https://www.rfc-editor.org/rfc/rfc4122.html).
              style: simple
              explode: false
              schema:
                format: uuid
                example: 1152537a-7f40-4405-860e-0fbdc75837b3
            Arena-Transaction-ID:
              description: |
                This header contains a randomly generated value assigned to each HTTP transaction received by the Arena Core Server. The value has 240-bit entropy and is encoded in the base32hex format, resulting in a 48-character lowercase string. It is used to locate the corresponding Arena Core Server response in the server logs. When customers inquire about responses from the Arena Core Server, providing this header value to the support team enhances the efficiency of support operations.
