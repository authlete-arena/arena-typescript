  /ssf/transmitter/{transmitter_id}/stream/list:
    get:
      summary: List streams.
      description: |-
        This API returns the streams that belong to the transmitter.

        Search criteria can be specified using query parameters when calling the
        API. For example, if the `status=enabled` query parameter is provided, only
        streams whose status is `enabled` are returned; streams whose status is
        `paused` or `disabled` are excluded from the response. Similarly, if the
        `created_at_ge=2026-01-01T12:00:00` query parameter is specified, only
        streams created on or after "2026-01-01 12:00:00 (UTC)" are returned.
        Multiple search criteria can be combined.

        The `limit` query parameter specifies the maximum number of streams
        included in the response. If this parameter is omitted, the default value
        of `50` is used. The value of `limit` must be between `1` and `200`,
        inclusive.

        If additional matching streams remain, the API response includes the
        `next_cursor` response parameter. By specifying its value as the `cursor`
        query parameter in the next API call, you can retrieve the next page of
        streams starting from the position indicated by the cursor. Therefore, by
        repeatedly calling the API with the `next_cursor` value returned in the
        previous response as the value of the `cursor` query parameter, until the
        response no longer contains `next_cursor`, you can retrieve all matching
        streams.

        If the `cursor` query parameter is included in an API call, all query
        parameters that specify search criteria are ignored. The cursor preserves
        the search criteria specified in the initial API call, so there is no need
        to specify them again. Note, however, that the `limit` query parameter is
        not considered a search criterion and can therefore be used together with
        the `cursor` query parameter.
      responses:
        "200":
          description: Streams were retrieved successfully.
          headers:
            x-fapi-interaction-id:
              description: |
                This header is defined in "[FAPI 1.0 Baseline](https://openid.net/specs/openid-financial-api-part-1-1_0.html)" and "FAPI 2.0 Implementation Advice". If the request includes this header, the response will contain a response header with the same name and the same value. If the request does not include this header, the value of the corresponding response header will be a randomly generated value. This mechanism is designed for tracking communication. When using this header, its value must be a UUID as defined in [RFC 4122](https://www.rfc-editor.org/rfc/rfc4122.html).
              style: simple
              explode: false
              schema:
                format: uuid
                example: 1152537a-7f40-4405-860e-0fbdc75837b3
            Arena-Transaction-ID:
              description: |
                This header contains a randomly generated value assigned to each HTTP transaction received by the Arena Core Server. The value has 240-bit entropy and is encoded in the base32hex format, resulting in a 48-character lowercase string. It is used to locate the corresponding Arena Core Server response in the server logs. When customers inquire about responses from the Arena Core Server, providing this header value to the support team enhances the efficiency of support operations.
                Strictly speaking, since the first 10 bits of the data are overwritten to ensure that the resulting string always starts with `at`, the actual entropy is 230 bits. The `at` here denotes Arena Transaction ID.
                The purpose of this process is to enable someone encountering a 48-character base32hex-encoded string beginning with `at` to infer that it might be an Arena Transaction ID. Conversely, a random string not starting with `at` can be identified as not being an Arena Transaction ID.
              style: simple
              explode: false
              schema:
                format: base32hex
                example: at26kkal1b9qounb2s5i4581vdrkub6sg6un88hej69ncigi
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      result:
                        properties:
                          status:
                            enum:
                              - success
                              - failure
                              - bad_request
                              - unauthorized
                              - forbidden
                              - not_found
                              - conflict
                              - server_error
                              - service_unavailable
                          code: {}
                          message: {}
                  - properties:
                      streams:
                        items:
                          properties:
                            id:
                              description: |
                                This is the primary key of the record representing the stream.
                            stream_id:
                              description: |
                                This is the stream ID that was automatically assigned when the stream was created.
                              format: base32hex
                            created_at:
                              description: |
                                This is the date and time when the stream was created. The format is `YYYY-MM-DDThh:mm:ss`.
                              format: date-time
                            status:
                              description: |
                                This is the status of the stream. The value is one of `enabled`, `paused`, or `disabled`.
                              enum:
                                - enabled
                                - paused
                                - disabled
                            description:
                              description: |
                                This is the description of the stream.
                      next_cursor: {}
              example:
                streams:
                  - id: 1
                    stream_id: stj3odpcfg19u6q62t2h7k0uk3t7srkdai6e0ccd7jd4ognt
                    created_at: 2025-05-06T12:00:00
                    status: enabled
                    description: SSF Receiver
                next_cursor: eyJpZCI6MX0
                result:
                  status: success
                  code: 1D2FD100
                  message: "[ARENA:1D2FD100] 1 stream was retrieved successfully."
