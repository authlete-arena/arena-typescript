openapi: 3.1.0
info:
  title: Arena Core Server
  contact:
    name: Authlete Support
    url: https://www.authlete.com/contact/
    email: support@authlete.com
  version: latest
servers:
  - url: /
security:
  - bearer: []
  - dpop: []
paths:
  /.well-known/oauth-protected-resource:
    get:
      summary: OAuth 2.0 Protected Resource Metadata
      description: |
        This API publishes the protected resource metadata of this server in a manner conformant to [RFC 9728: OAuth 2.0 Protected Resource Metadata](https://www.rfc-editor.org/rfc/rfc9728.html).
      externalDocs:
        description: "RFC 9728: OAuth 2.0 Protected Resource Metadata"
        url: https://www.rfc-editor.org/rfc/rfc9728.html
      responses:
        "200":
          description: |
            A successful response including the protected resource metadata of this server.
          headers:
            x-fapi-interaction-id:
              description: |
                This header is defined in "[FAPI 1.0 Baseline](https://openid.net/specs/openid-financial-api-part-1-1_0.html)" and "FAPI 2.0 Implementation Advice". If the request includes this header, the response will contain a response header with the same name and the same value. If the request does not include this header, the value of the corresponding response header will be a randomly generated value. This mechanism is designed for tracking communication. When using this header, its value must be a UUID as defined in [RFC 4122](https://www.rfc-editor.org/rfc/rfc4122.html).
              style: simple
              explode: false
              schema:
                format: uuid
                example: 1152537a-7f40-4405-860e-0fbdc75837b3
            Arena-Transaction-ID:
              description: |
                This header contains a randomly generated value assigned to each HTTP transaction received by the Arena Core Server. The value has 240-bit entropy and is encoded in the base32hex format, resulting in a 48-character lowercase string. It is used to locate the corresponding Arena Core Server response in the server logs. When customers inquire about responses from the Arena Core Server, providing this header value to the support team enhances the efficiency of support operations.
                Strictly speaking, since the first 10 bits of the data are overwritten to ensure that the resulting string always starts with `at`, the actual entropy is 230 bits. The `at` here denotes Arena Transaction ID.
                The purpose of this process is to enable someone encountering a 48-character base32hex-encoded string beginning with `at` to infer that it might be an Arena Transaction ID. Conversely, a random string not starting with `at` can be identified as not being an Arena Transaction ID.
              style: simple
              explode: false
              schema:
                format: base32hex
                example: at26kkal1b9qounb2s5i4581vdrkub6sg6un88hej69ncigi
          content:
            application/json:
              schema:
                required:
                  - resource
                properties:
                  resource:
                    description: |
                      REQUIRED. The protected resource's resource identifier, as defined in [Section 1.2](https://www.rfc-editor.org/rfc/rfc9728.html#Terminology).
                    format: uri
                  authorization_servers:
                    description: |
                      OPTIONAL. JSON array containing a list of OAuth authorization server issuer identifiers, as defined in [[RFC8414](https://www.rfc-editor.org/rfc/rfc8414.html)], for authorization servers that can be used with this protected resource. Protected resources MAY choose not to advertise some supported authorization servers even when this parameter is used. In some use cases, the set of authorization servers will not be enumerable, in which case this metadata parameter would not be used.
                    items:
                      format: uri
                  jwks_uri:
                    description: |
                      OPTIONAL. URL of the protected resource's JSON Web Key (JWK) Set [[JWK](https://www.rfc-editor.org/rfc/rfc7517.html)] document. This contains public keys belonging to the protected resource, such as signing key(s) that the resource server uses to sign resource responses. This URL MUST use the `https` scheme. When both signing and encryption keys are made available, a use (public key use) parameter value is REQUIRED for all keys in the referenced JWK Set to indicate each key's intended usage.
                    format: uri
                  scopes_supported:
                    description: |
                      RECOMMENDED. JSON array containing a list of scope values, as defined in [OAuth 2.0](https://www.rfc-editor.org/rfc/rfc6749.html) [[RFC6749](https://www.rfc-editor.org/rfc/rfc6749.html)], that are used in authorization requests to request access to this protected resource. Protected resources MAY choose not to advertise some scope values supported even when this parameter is used.
                    items: {}
                  bearer_methods_supported:
                    description: |
                      OPTIONAL. JSON array containing a list of the supported methods of sending an OAuth 2.0 bearer token [[RFC6750](https://www.rfc-editor.org/rfc/rfc6750.html)] to the protected resource. Defined values are [`"header"`, `"body"`, `"query"`], corresponding to Sections [2.1](https://rfc-editor.org/rfc/rfc6750#section-2.1), [2.2](https://rfc-editor.org/rfc/rfc6750#section-2.2), and [2.3](https://rfc-editor.org/rfc/rfc6750#section-2.3) of [[RFC6750](https://rfc-editor.org/rfc/rfc6750)]. The empty array [] can be used to indicate that no bearer methods are supported. If this entry is omitted, no default bearer methods supported are implied, nor does its absence indicate that they are not supported.
                    items:
                      enum:
                        - header
                        - body
                        - query
                  resource_signing_alg_values_supported:
                    description: |
                      OPTIONAL. JSON array containing a list of the JWS [[JWS](https://www.rfc-editor.org/rfc/rfc7515.html)] signing algorithms (alg values) [[JWA](https://www.rfc-editor.org/rfc/rfc7518.html)] supported by the protected resource for signing resource responses, for instance, as described in [[FAPI.MessageSigning](https://openid.net/specs/fapi-2_0-message-signing.html)]. No default algorithms are implied if this entry is omitted. The value `none` MUST NOT be used.
                    items: {}
                  resource_name:
                    description: |
                      Human-readable name of the protected resource intended for display to the end user. It is RECOMMENDED that protected resource metadata include this field. The value of this field MAY be internationalized, as described in [Section 2.1](https://www.rfc-editor.org/rfc/rfc9728.html#HumanReadableMetadata).
                  resource_documentation:
                    description: |
                      OPTIONAL. URL of a page containing human-readable information that developers might want or need to know when using the protected resource. The value of this field MAY be internationalized, as described in [Section 2.1](https://www.rfc-editor.org/rfc/rfc9728.html#HumanReadableMetadata).
                    format: uri
                  resource_policy_uri:
                    description: |
                      OPTIONAL. URL of a page containing human-readable information about the protected resource's requirements on how the client can use the data provided by the protected resource. The value of this field MAY be internationalized, as described in [Section 2.1](https://www.rfc-editor.org/rfc/rfc9728.html#HumanReadableMetadata).
                    format: uri
                  resource_tos_uri:
                    description: |
                      OPTIONAL. URL of a page containing human-readable information about the protected resource's terms of service. The value of this field MAY be internationalized, as described in [Section 2.1](https://www.rfc-editor.org/rfc/rfc9728.html#HumanReadableMetadata).
                    format: uri
                  tls_client_certificate_bound_access_tokens:
                    description: |
                      OPTIONAL. Boolean value indicating protected resource support for mutual-TLS client certificate-bound access tokens [[RFC8705](https://www.rfc-editor.org/rfc/rfc8705.html)]. If omitted, the default value is false.
                    default: false
                  authorization_details_types_supported:
                    description: |
                      OPTIONAL. JSON array containing a list of the authorization details type values supported by the resource server when the `authorization_details` request parameter [[RFC9396](https://www.rfc-editor.org/rfc/rfc9396.html)] is used.
                    items: {}
                  dpop_signing_alg_values_supported:
                    description: |
                      OPTIONAL. JSON array containing a list of the JWS alg values (from the "JSON Web Signature and Encryption Algorithms" registry [[IANA.JOSE](https://www.iana.org/assignments/jose/jose.xhtml)]) supported by the resource server for validating Demonstrating Proof of Possession (DPoP) proof JWTs [[RFC9449](https://www.rfc-editor.org/rfc/rfc9449.html)].
                    items: {}
                  dpop_bound_access_tokens_required:
                    description: |
                      OPTIONAL. Boolean value specifying whether the protected resource always requires the use of DPoP-bound access tokens [[RFC9449](https://www.rfc-editor.org/rfc/rfc9449.html)]. If omitted, the default value is false.
                    default: false
                description: |
                  [RFC 9728: OAuth 2.0 Protected Resource Metadata](https://www.rfc-editor.org/rfc/rfc9728.html)
              example:
                resource: https://arena.example.com
                authorization_servers:
                  - https://as.example.com
                jwks_uri: https://arena.example.com/jwks
                scopes_supported:
                  - arena:admin
                  - arena:ssf:admin
                  - arena:ssf:transmitter:admin
                  - arena:ssf:transmitter:create
                  - arena:ssf:transmitter:read
                  - arena:ssf:transmitter:update
                  - arena:ssf:transmitter:patch
                  - arena:ssf:transmitter:delete
                  - arena:ssf:transmitter:delegate:admin
                  - arena:ssf:transmitter:delegate:jwks
                  - arena:ssf:transmitter:delegate:stream:admin
                  - arena:ssf:transmitter:delegate:stream:create
                  - arena:ssf:transmitter:delegate:stream:read
                  - arena:ssf:transmitter:delegate:stream:update
                  - arena:ssf:transmitter:delegate:stream:replace
                  - arena:ssf:transmitter:delegate:stream:delete
                  - arena:ssf:transmitter:delegate:stream:verify
                  - arena:ssf:transmitter:delegate:stream:poll
                  - arena:ssf:transmitter:delegate:stream:status:admin
                  - arena:ssf:transmitter:delegate:stream:status:read
                  - arena:ssf:transmitter:delegate:stream:status:update
                  - arena:ssf:transmitter:delegate:stream:subject:admin
                  - arena:ssf:transmitter:delegate:stream:subject:add
                  - arena:ssf:transmitter:delegate:stream:subject:remove
                  - arena:ssf:transmitter:delegate:stream:subject:list
                  - arena:ssf:transmitter:delegate:well-known:admin
                  - arena:ssf:transmitter:delegate:well-known:oauth-protected-resource
                  - arena:ssf:transmitter:delegate:well-known:ssf-configuration
                  - arena:ssf:transmitter:event:admin
                  - arena:ssf:transmitter:event:register
                  - arena:ssf:transmitter:stream:admin
                  - arena:ssf:transmitter:stream:list
                  - arena:ssf:transmitter:stream:read
                  - arena:ssf:transmitter:stream:delete
                  - arena:ssf:transmitter:stream:verify
                  - arena:ssf:transmitter:stream:event:admin
                  - arena:ssf:transmitter:stream:event:list
                  - arena:ssf:transmitter:stream:event:read
                bearer_methods_supported:
                  - header
                resource_signing_alg_values_supported:
                  - ES256
                resource_name: Arena Core Server
                authorization_details_types_supported:
                  - cedar-policy
      security: []
      x-speakeasy-group: metadata
      x-speakeasy-name-override: getProtectedResource
    parameters:
      - name: x-fapi-interaction-id
        in: header
        description: |
          This header is defined in "[FAPI 1.0 Baseline](https://openid.net/specs/openid-financial-api-part-1-1_0.html)" and "FAPI 2.0 Implementation Advice". If the request includes this header, the response will contain a response header with the same name and the same value. If the request does not include this header, the value of the corresponding response header will be a randomly generated value. This mechanism is designed for tracking communication. When using this header, its value must be a UUID as defined in [RFC 4122](https://www.rfc-editor.org/rfc/rfc4122.html).
        required: false
        style: simple
        explode: false
        schema:
          format: uuid
          example: 1152537a-7f40-4405-860e-0fbdc75837b3
  /jwks:
    get:
      summary: JWK Set Document
      description: |
        This API publishes the JWK Set document of this server in a manner conformant to [RFC 7517: JSON Web Key (JWK)](https://www.rfc-editor.org/rfc/rfc7517.html).
      externalDocs:
        description: "RFC 7517: JSON Web Key (JWK)"
        url: https://www.rfc-editor.org/rfc/rfc7517.html
      responses:
        "200":
          description: |
            A successful response including the JWK Set document of this server.
          headers:
            x-fapi-interaction-id:
              description: |
                This header is defined in "[FAPI 1.0 Baseline](https://openid.net/specs/openid-financial-api-part-1-1_0.html)" and "FAPI 2.0 Implementation Advice". If the request includes this header, the response will contain a response header with the same name and the same value. If the request does not include this header, the value of the corresponding response header will be a randomly generated value. This mechanism is designed for tracking communication. When using this header, its value must be a UUID as defined in [RFC 4122](https://www.rfc-editor.org/rfc/rfc4122.html).
              style: simple
              explode: false
              schema:
                format: uuid
                example: 1152537a-7f40-4405-860e-0fbdc75837b3
            Arena-Transaction-ID:
