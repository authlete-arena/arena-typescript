                              - metadata
                            properties:
                              metadata:
                                required:
                                  - issuer
                                properties:
                                  spec_version:
                                    maxLength: 255
                                    description: |
                                      OPTIONAL. A version identifying the implementer's draft or final specification implemented by the Transmitter. This includes the numerical portion of the spec version as described in the document [[NAMINGCONVENTION](https://openid.net/wg/resources/naming-and-contents-of-specifications/)].
