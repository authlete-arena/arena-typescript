      - name: created_at_ge
        in: query
        description: |-
          This query parameter specifies the lower bound of the stream creation
          time as a search criterion. Only streams created on or after the
          specified date and time are included in the results. The following
          value formats are accepted:

          - `YYYY-MM-DD`
          - `YYYY-MM-DD[+-]hh:mm`
          - `YYYY-MM-DDThh:mm`
          - `YYYY-MM-DDThh:mmZ`
          - `YYYY-MM-DDThh:mm[+-]hh:mm`
          - `YYYY-MM-DDThh:mm:ss`
          - `YYYY-MM-DDThh:mm:ssZ`
          - `YYYY-MM-DDThh:mm:ss[+-]hh:mm`
        required: false
        style: form
        explode: true
        schema: {}
      - name: created_at_lt
        in: query
        description: |-
          This query parameter specifies the upper bound of the stream creation
          time as a search criterion. Only streams created before the specified
          date and time are included in the results. The following value formats
          are accepted:

          - `YYYY-MM-DD`
          - `YYYY-MM-DD[+-]hh:mm`
          - `YYYY-MM-DDThh:mm`
          - `YYYY-MM-DDThh:mmZ`
          - `YYYY-MM-DDThh:mm[+-]hh:mm`
          - `YYYY-MM-DDThh:mm:ss`
          - `YYYY-MM-DDThh:mm:ssZ`
          - `YYYY-MM-DDThh:mm:ss[+-]hh:mm`
        required: false
        style: form
        explode: true
        schema: {}
      - name: status
        in: query
        description: |-
          This query parameter specifies the stream status as a search criterion.
          The allowed values are `enabled`, `paused`, and `disabled`.
        required: false
        style: form
        explode: true
        schema:
          enum:
            - enabled
            - paused
            - disabled
      - name: limit
        in: query
        description: |-
          This query parameter specifies the maximum number of streams to include
          in the search results. If omitted, the default value is `50`. Valid
          values range from `1` to `200`, inclusive.
        required: false
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          default: 50
  /ssf/transmitter/{transmitter_id}/stream/{stream_id}:
    get:
      summary: Retrieve information about the stream.
      parameters:
        - name: stream_id
          in: path
          description: |
            The stream ID.
          required: false
          style: simple
          explode: false
          schema:
            format: base32hex
            example: stj3odpcfg19u6q62t2h7k0uk3t7srkdai6e0ccd7jd4ognt
      responses:
        "200":
          description: Successfully retrieved information about the stream.
          headers:
            x-fapi-interaction-id:
              description: |
                This header is defined in "[FAPI 1.0 Baseline](https://openid.net/specs/openid-financial-api-part-1-1_0.html)" and "FAPI 2.0 Implementation Advice". If the request includes this header, the response will contain a response header with the same name and the same value. If the request does not include this header, the value of the corresponding response header will be a randomly generated value. This mechanism is designed for tracking communication. When using this header, its value must be a UUID as defined in [RFC 4122](https://www.rfc-editor.org/rfc/rfc4122.html).
              style: simple
              explode: false
              schema:
                format: uuid
                example: 1152537a-7f40-4405-860e-0fbdc75837b3
            Arena-Transaction-ID:
              description: |
                This header contains a randomly generated value assigned to each HTTP transaction received by the Arena Core Server. The value has 240-bit entropy and is encoded in the base32hex format, resulting in a 48-character lowercase string. It is used to locate the corresponding Arena Core Server response in the server logs. When customers inquire about responses from the Arena Core Server, providing this header value to the support team enhances the efficiency of support operations.
                Strictly speaking, since the first 10 bits of the data are overwritten to ensure that the resulting string always starts with `at`, the actual entropy is 230 bits. The `at` here denotes Arena Transaction ID.
                The purpose of this process is to enable someone encountering a 48-character base32hex-encoded string beginning with `at` to infer that it might be an Arena Transaction ID. Conversely, a random string not starting with `at` can be identified as not being an Arena Transaction ID.
              style: simple
              explode: false
              schema:
                format: base32hex
                example: at26kkal1b9qounb2s5i4581vdrkub6sg6un88hej69ncigi
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      result:
                        properties:
                          status:
                            enum:
                              - success
                              - failure
                              - bad_request
                              - unauthorized
                              - forbidden
                              - not_found
                              - conflict
                              - server_error
                              - service_unavailable
                          code: {}
                          message: {}
                  - properties:
                      stream:
                        allOf:
                          - properties:
                              created_at:
                                description: |
                                  The time at which the stream was created, in the format of `YYYY-MM-DDThh:mm:ss`.
                                format: date-time
                                example: 2025-06-20T06:47:00
                              updated_at:
                                description: |
                                  The time at which the stream was updated, in the format of `YYYY-MM-DDThh:mm:ss`.
                                format: date-time
                                example: 2025-06-21T06:47:00
                              creator:
                                properties:
                                  iss:
                                    description: The issuer of the access token.
                                    format: uri
                                  sub:
                                    description: The subject of the access token.
                                  client_id:
                                    description: The client ID of the access token.
                                  jti:
                                    description: The identifier of the access token.
                                  hash:
                                    description: The base64url-encoded SHA-256 hash of the access token.
                                    format: base64url
                                description: The creator of the stream.
                              stream_id:
                                description: |
                                  The Stream ID assigned by the Arena Core Server. The value has 240-bit entropy and is encoded in the base32hex format, resulting in a 48-character lowercase string.
                                  Strictly speaking, since the first 10 bits of the data are overwritten to ensure that the resulting string always starts with `st`, the actual entropy is 230 bits. The `st` here denotes Stream.
                                  The purpose of this process is to enable someone encountering a 48-character base32hex-encoded string beginning with `st` to infer that it might be a Stream ID. Conversely, a random string not starting with `st` can be identified as not being a Stream ID.
                                format: base32hex
                                example: stj3odpcfg19u6q62t2h7k0uk3t7srkdai6e0ccd7jd4ognt
                          - required:
                              - metadata
                            properties:
                              metadata:
                                properties:
                                  stream_id:
                                    description: |
                                      Transmitter-Supplied, REQUIRED. A string that uniquely identifies the stream. A Transmitter MUST generate a unique ID for each of its non-deleted streams at the time of stream creation. Transmitters SHOULD use character set described in Section 2.3 of [RFC3986](https://www.rfc-editor.org/rfc/rfc3986.html) to generate the stream ID.
                                    example: stj3odpcfg19u6q62t2h7k0uk3t7srkdai6e0ccd7jd4ognt
                                  iss:
                                    description: |
