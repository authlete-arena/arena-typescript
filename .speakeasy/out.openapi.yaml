                  description: |
                    JSON Patch defined in [RFC 6902: JavaScript Object Notation (JSON) Patch](https://www.rfc-editor.org/rfc/rfc6902.html).
                  items:
                    required:
                      - op
                      - path
                    properties:
                      op:
                        enum:
                          - add
                          - remove
                          - replace
                          - move
                          - copy
                          - test
                      path: {}
                      value: {}
                      from: {}
                    description: |
                      JSON Patch's operation object defined in [RFC 6902: JavaScript Object Notation (JSON) Patch](https://www.rfc-editor.org/rfc/rfc6902.html).
                    example:
                      op: replace
                      path: /settings/name
