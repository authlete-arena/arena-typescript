                                format: date-time
                                example: 2025-06-20T06:47:00
                              updated_at:
                                description: |
                                  The time at which the transmitter was updated, in the format of `YYYY-MM-DDThh:mm:ss`.
                                format: date-time
                                example: 2025-06-21T06:47:00
                              creator:
                                properties:
                                  iss:
                                    description: The issuer of the access token.
                                    format: uri
                                  sub:
                                    description: The subject of the access token.
                                  client_id:
                                    description: The client ID of the access token.
                                  jti:
                                    description: The identifier of the access token.
                                  hash:
                                    description: The base64url-encoded SHA-256 hash of the access token.
                                    format: base64url
                                description: The creator of the transmitter.
                              transmitter_id:
                                description: |
                                  The Transmitter ID assigned by the Arena Core Server. The value has 240-bit entropy and is encoded in the base32hex format, resulting in a 48-character lowercase string.
