                The purpose of this process is to enable someone encountering a 48-character base32hex-encoded string beginning with `at` to infer that it might be an Arena Transaction ID. Conversely, a random string not starting with `at` can be identified as not being an Arena Transaction ID.
              style: simple
              explode: false
              schema:
                format: base32hex
                example: at26kkal1b9qounb2s5i4581vdrkub6sg6un88hej69ncigi
