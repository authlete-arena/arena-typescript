                                    default: false
                                  dpop_required:
                                    description: |
                                      This boolean flag indicates whether access tokens must be
                                      sender-constrained using the DPoP
                                      ([RFC 9449](https://www.rfc-editor.org/rfc/rfc9449.html)) mechanism.
                                    default: false
                                  dpop_nonce_required:
                                    description: |
