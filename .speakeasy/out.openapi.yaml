                                    format: uri
                                    example: https://transmitter.example.com/ssf/jwks
                                  delivery_methods_supported:
                                    uniqueItems: true
                                    description: |
                                      RECOMMENDED. List of supported delivery method URIs.
                                    example:
                                      - urn:ietf:rfc:8935
                                      - urn:ietf:rfc:8936
                                    items:
                                      format: uri
                                  configuration_endpoint:
                                    maxLength: 255
                                    description: |
