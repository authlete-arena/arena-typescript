      x-speakeasy-name-override: update

  # delegate.subjects — SSF stream subjects
  - target: "$.paths['/ssf/transmitter/{transmitter_id}/delegate/stream/subject/add'].post"
    description: delegate.subjects.add
    update:
      x-speakeasy-group: delegate.subjects
      x-speakeasy-name-override: add

  - target: "$.paths['/ssf/transmitter/{transmitter_id}/delegate/stream/subject/remove'].post"
