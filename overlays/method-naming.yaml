      x-speakeasy-name-override: remove

  - target: "$.paths['/ssf/transmitter/{transmitter_id}/delegate/stream/subject/list'].post"
    description: delegate.subjects.list
    update:
      x-speakeasy-group: delegate.subjects
      x-speakeasy-name-override: list
